
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafio da Live</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 12px;
  background: #260044;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: gold;
  font-size: 28px;
}

p {
  font-size: 18px;
}

#grade {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  max-width: 450px;
  margin: 25px auto;
}

.numero {
  padding: 15px 2px;
  border: 2px solid gold;
  border-radius: 10px;
  background: white;
  color: #260044;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.numero:disabled {
  background: #555;
  color: white;
  border-color: #777;
}

#mensagem {
  min-height: 65px;
  margin: 20px 0;
  color: gold;
  font-size: 22px;
  font-weight: bold;
}

#reiniciar {
  padding: 15px 25px;
  border: none;
  border-radius: 12px;
  background: gold;
  color: #260044;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>🎁 DESAFIO DA LIVE 🎁</h1>

<p>Escolha seu número de 1 até 100!</p>
<p>Boa sorte! 🍀</p>

<div id="grade"></div>

<div id="mensagem"></div>

<button id="reiniciar" onclick="iniciarJogo()">
RECOMEÇAR 🔄
</button>

<script>
function iniciarJogo() {
  var grade = document.getElementById("grade");
  var mensagem = document.getElementById("mensagem");

  grade.innerHTML = "";
  mensagem.innerHTML = "";

  for (var i = 1; i <= 100; i++) {
    var botao = document.createElement("button");

    botao.className = "numero";
    botao.innerHTML = i;

    botao.onclick = function() {
      this.disabled = true;
      this.innerHTML = "❌";

      mensagem.innerHTML =
        "😅 NÃO FOI DESSA VEZ! TENTE OUTRO!";
    };

    grade.appendChild(botao);
  }
}

iniciarJogo();
</script>

</body>
</html>
