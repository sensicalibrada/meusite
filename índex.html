
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrida de Veículos</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:12px;text-align:center;color:white;
 font-family:Arial;background:linear-gradient(145deg,#080d20,#202b50)
}
h1{color:#ffdf35}
#status{
 padding:15px;background:#ffffff18;
 border:2px solid #ffcf33;border-radius:14px;
 margin:15px auto;font-size:18px;font-weight:bold
}
#selecao{
 display:grid;grid-template-columns:repeat(5,1fr);
 gap:6px;max-width:650px;margin:15px auto
}
.opcao{
 background:#ffffff20;border:2px solid #ffffff44;
 color:white;border-radius:10px;padding:9px 2px;font-size:25px
}
.opcao small{display:block;font-size:11px}
.ativa{border:3px solid #ffdf35;background:#554300}
#pistas{
 background:#30343c;border:3px solid #aaa;
 border-radius:10px;padding:7px;margin:15px auto;
 max-width:750px
}
.pista{
 height:37px;position:relative;
 display:flex;align-items:center;
 border-bottom:1px dashed #ffffff66;overflow:hidden
}
.pista:last-child{border:0}
.id{position:absolute;left:2px;font-size:10px}
.carro{
 position:absolute;left:28px;font-size:23px;
 transition:left 4s cubic-bezier(.15,.65,.3,1)
}
.chegada{
 position:absolute;right:4px;width:12px;height:100%;
 background:repeating-linear-gradient(0deg,white 0 5px,black 5px 10px)
}
.pista.vencedor{background:#655000}
.pista.perdedor{background:#642020}
button{
 border:0;border-radius:12px;padding:14px 17px;
 margin:6px;font-size:16px;font-weight:bold;
 background:#ffcf33;color:#211500
}
#resultado{
 display:none;position:fixed;inset:0;z-index:10;
 background:#080817ed;align-items:center;
 justify-content:center;padding:15px
}
.caixa{
 width:100%;max-width:420px;
 background:linear-gradient(140deg,#4d006d,#17102e);
 border:3px solid #ffcf33;border-radius:22px;padding:25px 15px
}
.caixa h2{color:#ffdf35;font-size:27px}
.vencedorEmoji{
 font-size:100px;margin:15px;
 animation:pular .7s infinite alternate
}
@keyframes pular{
 from{transform:translateY(0)}
 to{transform:translateY(-12px)}
}
</style>
</head>
<body>

<h1>CORRIDA DE VEÍCULOS</h1>
<p>Escolha seu veículo!</p>

<div id="status">SELECIONE UM VEÍCULO!</div>
<div id="selecao"></div>

<button onclick="iniciar()">COMEÇAR CORRIDA</button>
<button onclick="reiniciar()">RECOMEÇAR</button>
<button onclick="telaCheia()">TELA CHEIA</button>

<div id="pistas"></div>

<div id="resultado">
 <div class="caixa">
  <h2>VEÍCULO VENCEDOR!</h2>
  <div class="vencedorEmoji" id="emojiVencedor"></div>
  <h2 id="nomeVencedor"></h2>
  <p id="escolhaFinal"></p>
  <button onclick="reiniciar()">NOVA CORRIDA</button>
 </div>
</div>

<script>
const veiculos=[
"🚗","🚕","🚙","🚌","🚎","🏎️","🚓","🚑","🚒","🚐",
"🛻","🚚","🚛","🚜","🏍️","🛵","🚲","🛴","🛺","🚔",
"🚍","🚘","🚖","🚡","🚠","🚟","🚃","🚋","🚞","🚝",
"🚄","🚅","🚈","🚂","🚆","🚇","🚊","🚉","🚁","🛩️",
"✈️","🛫","🛬","🚀","🛸","⛵","🛶","🚤","🛳️","⛴️",
"🛥️","🚢"
];

let escolhido=-1;
let vencedor=-1;
let correndo=false;
let finalizado=false;

function criar(){
 const selecao=document.getElementById("selecao");
 const pistas=document.getElementById("pistas");
 selecao.innerHTML="";
 pistas.innerHTML="";

 veiculos.forEach((emoji,i)=>{
  const b=document.createElement("button");
  b.className="opcao";
  b.innerHTML=emoji+"<small>Veículo "+(i+1)+"</small>";
  b.onclick=()=>selecionar(i);
  selecao.appendChild(b);

  const p=document.createElement("div");
  p.className="pista";
  p.id="pista"+i;
  p.innerHTML=
  '<span class="id">'+(i+1)+'</span>'+
  '<span class="carro" id="carro'+i+'">'+emoji+'</span>'+
  '<span class="chegada"></span>';
  pistas.appendChild(p);
 });
}

function selecionar(i){
 if(correndo||finalizado)return;
 escolhido=i;

 document.querySelectorAll(".opcao").forEach((b,n)=>{
  b.classList.toggle("ativa",n===i);
 });

 document.getElementById("status").textContent=
 "VOCÊ ESCOLHEU: "+veiculos[i]+" VEÍCULO "+(i+1);
}

function iniciar(){
 if(escolhido===-1){
  alert("Escolha um veículo primeiro!");
  return;
 }
 if(correndo||finalizado)return;

 correndo=true;

 const candidatos=veiculos.map((_,i)=>i).filter(i=>i!==escolhido);
 vencedor=candidatos[Math.floor(Math.random()*candidatos.length)];

 document.getElementById("status").textContent=
 "A CORRIDA COMEÇOU!";

 document.getElementById("pista"+escolhido).classList.add("perdedor");

 setTimeout(()=>{
  veiculos.forEach((_,i)=>{
   let distancia;
   if(i===vencedor) distancia=91;
   else if(i===escolhido) distancia=30;
   else distancia=45+Math.random()*38;

   document.getElementById("carro"+i).style.left=
   "calc("+distancia+"% - 25px)";
  });
 },300);

 setTimeout(()=>{
  correndo=false;
  finalizado=true;

  document.getElementById("pista"+vencedor).classList.add("vencedor");

  document.getElementById("status").textContent=
  "VEÍCULO "+(vencedor+1)+" VENCEU!";

  document.getElementById("emojiVencedor").textContent=
  veiculos[vencedor];

  document.getElementById("nomeVencedor").textContent=
  "VEÍCULO Nº "+(vencedor+1)+" GANHOU!";

  document.getElementById("escolhaFinal").textContent=
  "Você escolheu "+veiculos[escolhido]+
  " veículo nº "+(escolhido+1)+
  ". Ele não ganhou desta vez!";

  document.getElementById("resultado").style.display="flex";
 },4800);
}

function reiniciar(){
 escolhido=-1;
 vencedor=-1;
 correndo=false;
 finalizado=false;

 document.getElementById("resultado").style.display="none";
 document.getElementById("status").textContent=
 "SELECIONE UM VEÍCULO!";

 criar();
}

function telaCheia(){
 if(!document.fullscreenElement)
  document.documentElement.requestFullscreen?.();
 else
  document.exitFullscreen?.();
}

criar();
</script>
</body>
</html>
